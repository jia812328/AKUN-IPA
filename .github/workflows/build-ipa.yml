name: Build AKUN IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Build IPA
        run: |
          npx cap add ios
          (cd ios/App && pod install) || true
          npx cap sync ios
          cd ios/App && xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build build
          mkdir -p ios/App/build/Payload
          cp -r ios/App/build/App.app ios/App/build/Payload/
          cd ios/App/build && zip -r AKUN.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AKUN-IPA
          path: ios/App/build/*.ipa